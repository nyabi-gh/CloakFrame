[package]
name = "cloakframe-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cloakframe"
path = "src/main.rs"

[dependencies]
cloakframe-core.workspace = true
cloakframe-engine.workspace = true
eframe.workspace = true
fluent-bundle.workspace = true
image.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rfd.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "=0.21.2", default-features = false }
arboard = { version = "=3.7.0", default-features = false }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
# Already in the tree for AccessKit and the file dialogs; the blocking API asks a file manager
# to select a file.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "=0.6.2"
winit = { version = "=0.30.13", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest.workspace = true
fluent-syntax.workspace = true

[lints]
workspace = true
