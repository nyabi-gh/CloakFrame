[package]
name = "cloakframe-engine"
description = "CloakFrame job execution, media, inference, publishing and the command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cloakframe-cli"
path = "src/bin/cloakframe-cli.rs"

[dependencies]
cloakframe-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
image.workspace = true
turbojpeg.workspace = true
kamadak-exif.workspace = true
moxcms.workspace = true
ort.workspace = true
libwebp-sys.workspace = true
tiff.workspace = true
unicode-normalization.workspace = true
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
ring = { version = "=0.17.14", default-features = false }
# Reading the archives of the Linux GPU pack (src/gpu_pack.rs).
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }

[features]
# The synthetic processor for exercising the whole run without a media pipeline (M1 tests and
# `cloakframe-cli --synthetic`). Not part of release builds.
synthetic = []

# The accelerators the pinned runtimes carry (plan 3); with load-dynamic the features only add
# their API.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

# The CUDA provider of the GPU pack (src/gpu_pack.rs).
[target.'cfg(target_os = "linux")'.dependencies]
ort = { workspace = true, features = ["cuda"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell"] }

[lints]
workspace = true
