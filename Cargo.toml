[workspace]
resolver = "3"
members = ["crates/cloakframe-core", "crates/cloakframe-engine"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/nyabi-gh/CloakFrame"
publish = false

[workspace.dependencies]
cloakframe-core = { path = "crates/cloakframe-core" }

[workspace.lints.rust]
# OS·FFI 어댑터에서만 #[allow(unsafe_code)]로 국소 허용한다(계획 4.1).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
