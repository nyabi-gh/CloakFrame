[workspace]
resolver = "3"
members = ["crates/cloakframe-core", "crates/cloakframe-engine"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/nyabi-gh/CloakFrame"
publish = false

[workspace.dependencies]
cloakframe-core = { path = "crates/cloakframe-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "tiff", "bmp", "webp"] }
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"] }
kamadak-exif = "=0.6.1"
moxcms = "=0.9.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-27"] }
libwebp-sys = "=0.14.4"
tiff = { version = "=0.11.3", default-features = false, features = ["lzw"] }
unicode-normalization = "=0.1.25"

[workspace.lints.rust]
# OS·FFI 어댑터에서만 #[allow(unsafe_code)]로 국소 허용한다(계획 4.1).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
