[package]
name = "egui-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"] }
anyhow = "1"
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "=0.21.2", default-features = false }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["wgpu", "snapshot"] }

[profile.release]
debug = 1

[workspace]
