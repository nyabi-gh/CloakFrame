# 링크하는 crate는 Apache-2.0과 호환되어야 한다(계획 10.1). GPL·AGPL·LGPL crate는 허용 목록에
# 없으므로 막힌다. 목록에 없는 라이선스가 나오면 호환성을 확인한 뒤 이유와 함께 추가한다.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
