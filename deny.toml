# 링크하는 crate는 Apache-2.0과 호환되어야 한다(계획 10.1). GPL·AGPL·LGPL crate는 허용 목록에
# 없으므로 막힌다. 목록에 없는 라이선스가 나오면 호환성을 확인한 뒤 이유와 함께 추가한다.

[graph]
all-features = true
# 배포하는 세 대상만 본다. 다른 대상 전용 의존성(예: rustls-platform-verifier가 wasm32에서만 쓰는
# webpki-root-certs, CDLA-Permissive-2.0)은 빌드에 들어오지 않는다.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
# zbus 6 folded these crates into itself, so the zbus 5 ones are no longer maintained apart. The
# app's Linux accessibility (AccessKit's AT-SPI) and file dialogs (rfd's xdg-portal) still use
# zbus 5 and have no release on zbus 6 yet. Not a security defect; remove these once they move
# (2026-10-25 decision, docs/M6_PLAN.md).
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6; AccessKit and rfd still on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6; AccessKit and rfd still on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6; AccessKit and rfd still on zbus 5" },
]
