# M0에서 정한 Rust 툴체인과 crate 버전·feature. M1 workspace의 rust-toolchain.toml과
# Cargo.toml은 이 값을 그대로 쓴다. 여기 없는 crate는 처음 들이는 단계에서 정하고 추가한다.
# 근거는 각 항목의 evidence 문서에 있다.

schema = 1

[toolchain]
channel = "1.98.1"
# eframe 0.36의 MSRV. channel을 이 아래로 내리지 않는다.
msrv = "1.95"
evidence = "docs/RUST_PORT_PLAN.md#3-기술-스택"

[crates.ort]
version = "=2.0.0-rc.15"
default-features = false
features = ["std", "load-dynamic", "api-27"]
features-macos = ["coreml"]
features-windows = ["directml"]
# api-N은 세 OS 중 가장 낮은 ORT(Windows ML 2.4.89 안의 1.27.1)가 정한다. api-30이면 Windows에서 BadVersion.
# 세션마다 with_auto_device(PreferCPU)로 기본 EP 자동 선택(MaxEfficiency)을 덮는다.
# rc.14는 세션 출력마다 OrtTypeInfo를 놓지 않아 rc.15로 올림(docs/M5_VERIFY.md).
# coreml·directml은 M3에서 engine Cargo.toml의 대상별 feature로 붙였다.
evidence = "docs/M0_ORT_SPIKE.md"

[crates.eframe]
version = "=0.36.2"
default-features = false
features = ["accesskit", "default_fonts", "wgpu", "glow", "wayland", "x11"]
evidence = "docs/M0_EGUI.md"

[crates.egui_kittest]
version = "=0.36.2"
features = ["wgpu", "snapshot"]
dev = true
evidence = "docs/M0_EGUI.md"

[crates.muda]
version = "=0.20.0"
default-features = false
# GTK 창에만 붙으므로 Linux에서는 쓰지 않는다. Windows는 winit with_msg_hook에서 TranslateAcceleratorW가 필요하다.
targets = ["macos", "windows"]
evidence = "docs/M0_EGUI.md"

[crates.image]
version = "=0.25.10"
default-features = false
features = ["png", "tiff", "bmp", "webp"]
# JPEG는 turbojpeg가 맡는다(zune-jpeg 결함, docs/M2_ENCODE_SPIKE.md). 손실 WebP는 libwebp-sys.
evidence = "docs/M0_EXIF_WRITER.md"

[crates.kamadak-exif]
version = "=0.6.1"
evidence = "docs/M0_EXIF_WRITER.md"

[crates.windows-sys]
version = "=0.61.2"
features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell"]
targets = ["windows"]
# 파일 identity(GetFileInformationByHandleEx FileIdInfo), no-replace 이동(MoveFileExW), 앱 데이터 폴더
# (SHGetKnownFolderPath), 메모리 예산의 실제 RAM(GlobalMemoryStatusEx), FFmpeg 프로세스 트리를 묶는 Job Object. 앱 데이터 폴더를 directories crate로 찾지 않는 이유는 그 의존성 option-ext가
# MPL-2.0이기 때문(2026-10-18 결정, deny.toml 허용 목록 유지).
evidence = "crates/cloakframe-engine/src/identity.rs"

[crates.rustix]
version = "=1.1.5"
features = ["fs", "process"]
targets = ["linux", "macos"]
# no-replace rename(Linux renameat2 NOREPLACE, macOS renameatx_np RENAME_EXCL). 계획 3장의 파일시스템 항목.
# process는 FFmpeg 프로세스 그룹 종료.
evidence = "crates/cloakframe-engine/src/publish.rs"

[crates.ctrlc]
version = "=3.5.2"
features = ["termination"]
# CLI의 Ctrl+C·SIGTERM 취소(M1에서 M4로 넘어옴). 첫 신호는 실행 취소, 두 번째는 바로 종료(2026-10-21 결정).
evidence = "docs/M4_PROCESS.md"

[crates.serde]
version = "=1.0.229"
features = ["derive"]
# core가 쓰는 유일한 외부 crate. 세션 형식은 crates/cloakframe-core/tests/serde_forms.rs가 고정한다.
evidence = "crates/cloakframe-engine/src/session.rs"

[crates.serde_json]
version = "=1.0.154"
evidence = "crates/cloakframe-engine/src/session.rs"

[crates.sha2]
version = "=0.11.0"
# 0.11.1(2026-10-12)은 나온 지 일주일이 안 되어 쓰지 않음.
evidence = "crates/cloakframe-engine/src/batch.rs"

[crates.turbojpeg]
version = "=1.5.1"
default-features = false
features = ["cmake"]
# libjpeg-turbo 3.1.0을 turbojpeg-sys 1.2.0이 소스에서 정적 빌드한다(native.toml의 libjpeg-turbo).
# 릴리스 빌드는 x86에서 nasm을 두어 SIMD를 켠다.
evidence = "docs/M2_ENCODE_SPIKE.md"

[crates.libwebp-sys]
version = "=0.14.4"
# libwebp 1.6.0을 소스에서 정적 빌드한다(native.toml의 libwebp). 손실 WebP 인코드에만 쓴다.
evidence = "docs/M2_ENCODE_SPIKE.md"

[crates.tiff]
version = "=0.11.3"
default-features = false
features = ["lzw"]
# image가 이미 쓰는 판. image의 TIFF 인코더는 압축을 고를 수 없어 직접 LZW로 쓴다(D6, 1.12.1과 같은 압축).
# TIFF ICC 판독도 직접 한다: image는 limit을 pixel 버퍼 크기로 잡아 작은 TIFF의 profile을 버린다.
evidence = "crates/cloakframe-engine/src/photo/encode.rs"

[crates.libc]
version = "=0.2.191"
targets = ["linux", "macos"]
# 메모리 예산의 실제 RAM 조회(sysctl hw.memsize, sysconf). 1.12.1과 같은 규칙.
evidence = "crates/cloakframe-engine/src/photo/budget.rs"

[crates.unicode-normalization]
version = "=0.1.25"
# 출력 이름 충돌 판정에서 정규화를 무시하는 볼륨(APFS·HFS+)의 NFC·NFD 이름을 한 이름으로 본다(D10, 재검토 9번).
evidence = "crates/cloakframe-engine/src/fs_case.rs"

[crates.moxcms]
version = "=0.9.1"
# ICC 판정과 sRGB 변환에만 쓴다. 출력에 넣는 profile은 assets/icc(tools/icc/make_profiles.py)이며,
# moxcms의 encode 결과는 libpng 검사(4바이트 정렬)를 통과하지 못해 쓰지 않는다.
evidence = "crates/cloakframe-engine/src/photo/color.rs"

[crates.ureq]
version = "=3.4.2"
default-features = false
features = ["rustls-no-provider", "platform-verifier"]
# 모델 다운로드. 동기 API라 Tokio가 없다(2026-10-19, 계획 3장의 reqwest 대신). redirect는 engine이 한 단계씩
# allowlist로 검사한다. rustls feature는 webpki-roots(CDLA-Permissive-2.0)를 넣으므로 쓰지 않고 OS 인증서
# 저장소(platform-verifier)로 확인한다. 공개 2주가 안 된 ureq-proto 0.6.5 등 다섯 crate는 Cargo.lock에서 이전 판.
evidence = "docs/M3_MODELS.md"

[crates.rustls]
version = "=0.23.46"
default-features = false
features = ["ring", "std", "tls12"]
# ureq에 넘기는 암호 provider(ring). 0.23.45에는 보안 권고 4건(RUSTSEC-2026-0346–0349)이 있어 공개 5일 된 판을 쓴다.
evidence = "docs/M3_MODELS.md"
