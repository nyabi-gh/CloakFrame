# cargo-about: the licenses of the Rust crates linked into the app, for the notices a package
# carries (tools/package/macos_preview.sh). The accepted licenses are deny.toml's allow list.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# CloakFrame's own crates, which LICENSE covers.
private = { ignore = true }
