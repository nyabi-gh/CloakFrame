name: Publish the update feed

# Installed apps take the feed as soon as it changes, so it goes up only when the maintainer
# publishes a release the release workflow drafted (docs/RELEASING.md). Publishing it is the
# approval. A release published with the workflow token starts no workflow, so this runs only
# for one the maintainer published. The packages bundle FFmpeg, so the corresponding source
# from the release goes up beside them (plan 10.1).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish the update feed
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the signed packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w release.yml -e push -b "$TAG" -s success \
            -L 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error::No successful release workflow run for $TAG"
            exit 1
          fi
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n windows-feed-signed -D "$RUNNER_TEMP/feed"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n linux-feed-signed -D "$RUNNER_TEMP/feed"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*-source.tar' -D "$RUNNER_TEMP/source"

      # The feeds go last, so that they never list a package that is not there yet.
      - name: Upload to the updates release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view updates -R "$GITHUB_REPOSITORY" > /dev/null; then
            gh release create updates -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Update feed" --notes "The feed CloakFrame 2 reads for updates. Download the app from the releases above."
          fi
          gh release upload updates -R "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP"/source/*-source.tar
          cd "$RUNNER_TEMP/feed"
          gh release upload updates -R "$GITHUB_REPOSITORY" --clobber *.nupkg *.nupkg.sig
          gh release upload updates -R "$GITHUB_REPOSITORY" --clobber releases.win.json releases.linux.json
