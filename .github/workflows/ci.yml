name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # 기준이 main이 아닌 쌓인 PR의 브랜치를 직접 돌릴 때.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --locked --all-features -- -D warnings

      - name: Check dependency licenses, sources and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: Test download badge aggregation
        run: node --test .github/scripts/update-download-badge.test.js

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: onnxruntime linux-x86_64
            platform: linux-x86_64
            python: python3
          - os: macos-15
            runtime: onnxruntime macos-arm64
            platform: macos-arm64
            python: python3
          - os: windows-2025
            runtime: windows-ml windows-x64
            platform: windows-x64
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        run: rustup toolchain install

      # The detector tests run the pinned ONNX Runtime (manifests/native.toml) on the hashed
      # models and images of tests/fixtures/assets.json; the media tests run the pinned FFmpeg.
      - name: Fetch ONNX Runtime, FFmpeg, models and sample images
        shell: bash
        run: |
          lib=$(${{ matrix.python }} -I tools/fetch_native.py ${{ matrix.runtime }} "$RUNNER_TEMP/native")
          ffmpeg=$(${{ matrix.python }} -I tools/fetch_native.py ffmpeg ${{ matrix.platform }} "$RUNNER_TEMP/native")
          # macOS has ffprobe as its own artifact; the other builds carry it next to ffmpeg.
          if [ "${{ matrix.platform }}" = macos-arm64 ]; then
            ffprobe=$(${{ matrix.python }} -I tools/fetch_native.py ffprobe ${{ matrix.platform }} "$RUNNER_TEMP/native")
          else
            ffprobe="${ffmpeg%ffmpeg*}ffprobe${ffmpeg##*ffmpeg}"
          fi
          assets=$(${{ matrix.python }} -I tools/fetch_test_assets.py "$RUNNER_TEMP/cloakframe-test-assets")
          echo "CLOAKFRAME_ORT_LIBRARY=$lib" >> "$GITHUB_ENV"
          echo "CLOAKFRAME_FFMPEG=$ffmpeg" >> "$GITHUB_ENV"
          echo "CLOAKFRAME_FFPROBE=$ffprobe" >> "$GITHUB_ENV"
          echo "CLOAKFRAME_TEST_ASSETS=$assets" >> "$GITHUB_ENV"

      # tests/windows_fat32.rs: camera cards are FAT32, which has no 128-bit file IDs.
      - name: Make a FAT32 volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'fat32.vhd'
          $script = Join-Path $env:RUNNER_TEMP 'fat32.diskpart'
          @(
            "create vdisk file=`"$vhd`" maximum=256 type=expandable"
            "select vdisk file=`"$vhd`""
            'attach vdisk'
            'create partition primary'
            'format fs=fat32 quick label=CFFAT32'
            'assign letter=T'
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CLOAKFRAME_FAT32_DIR=T:\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Test
        # `synthetic` adds the end-to-end CLI tests; release builds leave it off.
        env:
          ORT_DISABLE_TELEMETRY: "1"
        run: cargo test --workspace --locked --all-features

      # Plan M4 stage 2: the stdout pipe on every OS, measured (1.12.1 used a named pipe on
      # Windows). The test prints frames per second and MB/s; the log keeps it with --nocapture.
      - name: Measure the decode pipe
        env:
          ORT_DISABLE_TELEMETRY: "1"
        run: cargo test -p cloakframe-engine --locked --all-features --test media_decode decode_throughput -- --ignored --nocapture

      # Plan M4 stage 3: the stdin pipe into the software encoder an export uses, measured the
      # same way.
      - name: Measure the encode pipe
        env:
          ORT_DISABLE_TELEMETRY: "1"
        run: cargo test -p cloakframe-engine --locked --all-features --test media_encode encode_throughput -- --ignored --nocapture

      # Plan M5 stage 1: a video's first pass with ORT's CPU sessions not spinning, as they run,
      # against spinning, as 1.12.1 ran them. The test prints frames per second of each.
      - name: Measure the first pass
        env:
          ORT_DISABLE_TELEMETRY: "1"
        run: cargo test -p cloakframe-engine --locked --all-features --test video_detect first_pass_throughput -- --ignored --nocapture
