name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # 기준이 main이 아닌 쌓인 PR의 브랜치를 직접 돌릴 때.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --workspace --all-targets --locked --all-features -- -D warnings

      - name: Check dependency licenses, sources and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: Test download badge aggregation
        run: node --test .github/scripts/update-download-badge.test.js

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: onnxruntime linux-x86_64
            python: python3
          - os: macos-15
            runtime: onnxruntime macos-arm64
            python: python3
          - os: windows-2025
            runtime: windows-ml windows-x64
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust
        run: rustup toolchain install

      # The detector tests run the pinned ONNX Runtime (manifests/native.toml) on the hashed
      # models and images of tests/fixtures/assets.json.
      - name: Fetch ONNX Runtime, models and sample images
        shell: bash
        run: |
          lib=$(${{ matrix.python }} -I tools/fetch_native.py ${{ matrix.runtime }} "$RUNNER_TEMP/native")
          assets=$(${{ matrix.python }} -I tools/fetch_test_assets.py "$RUNNER_TEMP/cloakframe-test-assets")
          echo "CLOAKFRAME_ORT_LIBRARY=$lib" >> "$GITHUB_ENV"
          echo "CLOAKFRAME_TEST_ASSETS=$assets" >> "$GITHUB_ENV"

      - name: Test
        # `synthetic` adds the end-to-end CLI tests; release builds leave it off.
        env:
          ORT_DISABLE_TELEMETRY: "1"
        run: cargo test --workspace --locked --all-features
