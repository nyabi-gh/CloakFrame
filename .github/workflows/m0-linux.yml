name: M0 Linux

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0:
    name: M0 checks (Ubuntu 24.04 x86_64, no GUI)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl python3-venv ffmpeg strace binutils squashfs-tools

      - name: Install Rust
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' manifests/rust.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"

      - name: Run M0 script
        run: USER=$(id -un) spikes/platform-runs/linux/run_m0_linux.sh --no-gui "$RUNNER_TEMP/m0-linux"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m0-linux-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m0-linux
            !${{ runner.temp }}/m0-linux/work
          if-no-files-found: error
